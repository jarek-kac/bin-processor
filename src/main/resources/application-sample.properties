
mp.jwt.verify.issuer=https://example.com
smallrye.jwt.verify.key.location=secretKey.jwk
smallrye.jwt.verify.key-format=jwk
smallrye.jwt.verify.algorithm=HS256

quarkus.rest-client.mastercard-bin-api.url=https://sandbox.api.mastercard.com/bin-resources

mastercard.api.consumer-key=###
mastercard.api.key-file-path=##
mastercard.api.key-alias=##
mastercard.api.key-password=##

quarkus.log.console.format=%d{HH:mm:ss} %-5p [%X{requestId}] [%c{2.}] (%t) %s%e%n

quarkus.cache.caffeine."bin-lookup-cache".expire-after-write=24H
quarkus.cache.caffeine."bin-lookup-cache".maximum-size=10000

quarkus.log.category."io.smallrye.jwt".level=DEBUG
%dev.quarkus.log.category."fraud".level=INFO